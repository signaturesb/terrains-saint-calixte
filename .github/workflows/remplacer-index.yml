name: Remplacer index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remplacer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deplacer le fichier optimise vers index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv index-optimise.html index.html
          rm -f .github/workflows/remplacer-index.yml
          git add -A
          git commit -m "Page allégée — photos WebP (6,4 → 4,0 Mo)"
          git push
