name: Remplacer index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remplacer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer index.html et supprimer le workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          test -f page-finale-v2.html
          git mv -f page-finale-v2.html index.html
          rm -f .github/workflows/remplacer-index.yml
          git add -A
          git status --short
          git commit -m "Page finale v2"
          git push
