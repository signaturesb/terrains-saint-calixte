name: Remplacer index
on: workflow_dispatch
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git mv -f page-finale-v10-coordonnee.html index.html
          rm -f .github/workflows/remplacer-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Page finale v10"
          git push
